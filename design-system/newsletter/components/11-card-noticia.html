<!-- ============================================================================
     11 · NOTÍCIA COM PAINEL — a imagem dentro de um painel de raio 20px, e embaixo, solto na
     página, tag opcional + título + texto + link opcional. É o bloco principal de newsletter
     de produto e atualizações. Entre dois itens, espaçador de 40px.

     Três variantes de painel — escolher pela imagem, não pelo gosto:
       A · ARTE    painel accent-soft #F3E8FF. Arte, ilustração, mockup sobre fundo próprio.
       B · TELA    painel surface-alt #F9F8FC, imagem com borda hairline e raio 12px.
                   Print de tela com fundo branco: o lavanda forte brigaria com o print.
       C · RECORTE painel accent-soft, sem padding embaixo: PNG com fundo transparente
                   (celular na mão, produto recortado) encosta no pé do painel.
     No dark mode o painel vira #262030 (.dm-tag).

     Imagem: até 472 de largura (536 − 2×32 de padding). 16:9 → 472 (exportar 944);
     1:1 → 400 (exportar 800), centralizada. No mobile o padding cai para 16px (.painel).

     Linhas opcionais: TAG (apagar a <tr> inteira se não houver), SUBTITULO e LINK. Link de
     artigo que o briefing não trouxer sai — não repetir o CTA principal.
     ============================================================================ -->

<!-- PAINEL · variante A (arte). Para B, trocar #F3E8FF por #F9F8FC nos dois lugares e acrescentar
     border-radius:12px;border:1px solid #E3DDF1; no estilo do <img>. Para C, trocar a classe do td
     por "painel-recorte" e o padding por 32px 32px 0 32px. -->
<tr>
  <td class="p-mobile" style="padding:0 32px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#F3E8FF" class="dm-tag" style="width:100%;background-color:#F3E8FF;border-radius:20px;">
      <tr>
        <td align="center" class="painel" style="padding:32px;font-size:0;line-height:0;">
          <img src="{{URL_IMAGEM}}" width="472" alt="{{ALT}}" style="display:block;border:0;outline:none;text-decoration:none;width:100%;max-width:472px;height:auto;" />
        </td>
      </tr>
    </table>
  </td>
</tr>
<tr><td height="20" style="height:20px;line-height:20px;font-size:0;mso-line-height-rule:exactly;">&nbsp;</td></tr>

<!-- TAG (opcional) -->
<tr>
  <td align="left" class="p-mobile" style="padding:0 32px 12px 32px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="left">
      <tr>
        <td align="center" bgcolor="#F3E8FF" class="dm-tag" style="border-radius:100px;padding:6px 12px;">
          <span class="dm-accent" style="font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:16px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#9025F4;">{{TAG}}</span>
        </td>
      </tr>
    </table>
  </td>
</tr>

<!-- TEXTO — título, subtítulo opcional, texto e link opcional -->
<tr>
  <td class="p-mobile" style="padding:0 32px;">
    <h3 class="t-h3 dm-ink" style="margin:0 0 8px 0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;line-height:26px;font-weight:600;color:#18181B;letter-spacing:-0.2px;">{{TITULO}}</h3>
    <p class="dm-accent" style="margin:0 0 8px 0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:22px;font-weight:600;color:#9025F4;">{{SUBTITULO}}</p>
    <p class="dm-body" style="margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;font-weight:400;color:#353E4F;">{{TEXTO}}</p>
    <p style="margin:12px 0 0 0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;"><a href="{{URL_LINK}}" target="_blank" class="dm-accent" style="font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:600;color:#9025F4;text-decoration:none;">{{LABEL_LINK}} &rarr;</a></p>
  </td>
</tr>
