<!-- 04 · TEXTO + CTA — parágrafo de apoio, alinhado à esquerda, com um botão primário.
     Peça que fecha com a 89-faixa-cta-mesh já tem o CTA lá: aqui, apagar as linhas do botão
     e ficar só com o texto (um CTA por peça). -->
<tr>
  <td align="left" class="p-mobile" style="padding:0 32px;">
    <p class="dm-body" style="margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:25px;font-weight:400;color:#353E4F;">{{TEXTO}}</p>
  </td>
</tr>
