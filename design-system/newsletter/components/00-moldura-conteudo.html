<!-- ============================================================================
     00 · MOLDURA DE CONTEÚDO — o card branco de raio 20px que envolve todos os blocos de
     conteúdo da peça (02 a 13b), do título ao último bloco. O header (01) fica acima dele,
     com o próprio card; o rodapé (90 e 91) fica fora, sobre o fundo da página.

     Como usar: colar a parte ABRE logo depois do 01-header, os blocos de conteúdo dentro
     dela (com o 99-spacer entre eles, como sempre), e a parte FECHA depois do último bloco.
     Os blocos continuam como estão: o padding lateral deles (32px) passa a contar a partir
     da borda do card. O espaçador de 32px que vem antes do 90-social fica fora da moldura.

     Dark mode: o card vira #242424 (.dm-surface), como qualquer card de seção.
     ============================================================================ -->

<!-- ABRE -->
<tr>
  <td class="p-mobile" style="padding:0 32px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#FFFFFF" class="dm-surface" style="width:100%;background-color:#FFFFFF;border-radius:20px;">
      <tr><td height="40" class="h-mobile" style="height:40px;line-height:40px;font-size:0;mso-line-height-rule:exactly;">&nbsp;</td></tr>


<!-- FECHA -->
      <tr><td height="40" class="h-mobile" style="height:40px;line-height:40px;font-size:0;mso-line-height-rule:exactly;">&nbsp;</td></tr>
    </table>
  </td>
</tr>
