<!-- 02a · EYEBROW / TAG — pílula com a cor de marca acima da headline.
     Fundo #F3E8FF + texto #9025F4. A classe .dm-tag ajusta o fundo no dark mode. -->
<tr>
  <td align="left" class="p-mobile" style="padding:0 32px 16px 32px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="left">
      <tr>
        <td align="center" bgcolor="#F3E8FF" class="dm-tag" style="border-radius:100px;padding:7px 14px;">
          <span class="dm-accent" style="font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:16px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#9025F4;">{{TAG}}</span>
        </td>
      </tr>
    </table>
  </td>
</tr>
